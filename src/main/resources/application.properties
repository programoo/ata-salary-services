spring.application.name=ata-salary-services

# Allow [ and ] in query strings (e.g. salary[gte]=120000) which Tomcat rejects by default per RFC 3986
server.tomcat.relaxed-query-chars=[,]

# SQLite file database, created in the project's ./data directory on first run
spring.datasource.url=jdbc:sqlite:data/salary.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Import the seed datasets below on startup. In Kubernetes only the seed Job does this (app pods set it to false)
app.data.import-enabled=true
# Classpath location of the seed dataset, imported once on startup if the table is empty
app.data.import-file=classpath:data/salary_survey-3.json
# Order seed dataset (exported from ata-order-web's mock fixture), imported once if the orders table is empty
app.data.orders-import-file=classpath:data/orders.json

# Browser origins allowed to call /api/** (comma-separated); default is the ata-order-web Vite dev server
app.cors.allowed-origins=http://localhost:5173

# Health probes for Kubernetes: /actuator/health/liveness and /actuator/health/readiness.
# Spring turns these on automatically inside Kubernetes; enabling them here makes them work locally too.
management.endpoint.health.probes.enabled=true
# Readiness also checks the database: a pod that can't reach Postgres stops receiving traffic.
# Liveness deliberately does NOT, because restarting the app can't fix a database outage.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-components=always
# Always set "include" when touching a group: a group without it includes EVERY check (db, disk, ...)
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-components=always

# Learning aid: POST /demo/probes/... flips this pod's liveness/readiness (see readme_probes_k8s.md). Never enable in production
app.probe-demo.enabled=false

# DEBUG also logs response bodies (cut to app.logging.max-body-length chars); INFO logs only method, URI, status and time
logging.level.com.ata.salaryservices.config.RequestLoggingFilter=DEBUG
app.logging.max-body-length=1000