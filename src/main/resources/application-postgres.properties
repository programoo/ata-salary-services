# Active with SPRING_PROFILES_ACTIVE=postgres (set in k8s/deployment.yaml and k8s/seed-job.yaml).
# Overrides the SQLite settings in application.properties; connection details come from env vars.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:salary}
spring.datasource.username=${DB_USERNAME:salary}
spring.datasource.password=${DB_PASSWORD:salary}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
