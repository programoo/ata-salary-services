apiVersion: apps/v1
kind: Deployment
metadata:
  name: salary-app
  labels:
    app: salary-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: salary-app
  template:
    metadata:
      labels:
        app: salary-app
    spec:
      initContainers:
        # Hold the pod until the salary-seed Job has created and filled both
        # tables; otherwise schema validation below fails on an empty database.
        - name: wait-for-seed
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until psql -tAc "SELECT 1 FROM salary_records LIMIT 1" 2>/dev/null | grep -q 1 \
                 && psql -tAc "SELECT 1 FROM orders LIMIT 1" 2>/dev/null | grep -q 1; do
                echo waiting for salary-seed job; sleep 3
              done
          env:
            # a single key from the ConfigMap, renamed to what psql expects
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: salary-app-config
                  key: DB_HOST
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
      containers:
        - name: salary-app
          # keep in sync with k8s/seed-job.yaml
          image: ata-salary-services:1.9
          # image lives only in the cluster's local store, never pull it
          imagePullPolicy: IfNotPresent
          # every key in the ConfigMap becomes an env var with the same name
          envFrom:
            - configMapRef:
                name: salary-app-config
          # settings specific to this workload; an entry here overrides the same name from envFrom
          env:
            # the seed Job owns the schema and data; app pods only check the schema matches
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: validate
            - name: APP_DATA_IMPORT_ENABLED
              value: "false"
            # learning aid for readme_probes_k8s.md; remove before any real deployment
            - name: APP_PROBE_DEMO_ENABLED
              value: "true"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          # Probes are explained in readme_probes_k8s.md. None of them run while
          # the init container above is still waiting.
          #
          # startup: protects a slow-starting JVM. Liveness and readiness don't
          # start until this passes once; allows up to 30 x 5s = 150s to start.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # readiness: "send me traffic?" Failing removes the pod from the Service
          # (no restart). Includes the database check, see application.properties.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # liveness: "is the process stuck?" Failing 3 times in a row restarts the
          # container. Never includes the database: a restart can't fix Postgres.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
