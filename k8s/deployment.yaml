apiVersion: apps/v1
kind: Deployment
metadata:
  name: salary-app
  labels:
    app: salary-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: salary-app
  template:
    metadata:
      labels:
        app: salary-app
    spec:
      containers:
        - name: salary-app
          image: ata-salary-services:1.5
          # image lives only in the cluster's local store, never pull it
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
