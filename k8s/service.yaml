apiVersion: v1
kind: Service
metadata:
  name: salary-app
  labels:
    app: salary-app
spec:
  type: NodePort
  selector:
    app: salary-app
  ports:
    - name: http
      port: 80          # ClusterIP port (inside the cluster)
      targetPort: http  # container port 8080
      nodePort: 30080   # opened on every node (30000-32767)
