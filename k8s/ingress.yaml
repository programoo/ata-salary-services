# One entry point for both apps: the ingress controller (minikube addon
# "ingress") reads the Host header of each request and forwards it to the
# matching Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ata-apps
spec:
  ingressClassName: nginx
  rules:
    - host: salary.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: salary-app
                port:
                  number: 80
    - host: orders.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-web
                port:
                  number: 80
